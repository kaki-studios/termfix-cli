[package]
name = "termfix"
version = "0.1.2"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
portable-pty = "0.9.0"
tokio = { version = "1.52.1", features = ["full"] }
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", features = ["link-static"] }
# have to use 0.28.0 bc that's what portable-pty uses
nix = { version = "0.28.0", features = ["term"] }
reqwest = { version = "0.13.3", default-features = false, features = ["charset", "http2", "json", "rustls-no-provider", "stream", "system-proxy"] }
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3.31"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
shell-words = "1.1.0"
toml = "1.1.2"
chrono = "0.4.44"
