name: Build and Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.id }})
    runs-on: ${{ matrix.runner }}
    env:
      RUST_TARGET: ${{ matrix.rust_target }}
      AWS_LC_SYS_NO_ASM: ${{ matrix.aws_lc_sys_no_asm }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x86_64
            runner: ubuntu-latest
            rust_target: x86_64-unknown-linux-gnu
            artifact_name: termfix-linux-x86_64
            aws_lc_sys_no_asm: "0"
          - id: macos-arm64
            runner: macos-latest
            rust_target: aarch64-apple-darwin
            artifact_name: termfix-macos-arm64
            aws_lc_sys_no_asm: "1"
          - id: macos-x86_64
            runner: macos-latest
            rust_target: x86_64-apple-darwin
            artifact_name: termfix-macos-x86_64
            aws_lc_sys_no_asm: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Add Rust target
        run: rustup target add ${{ matrix.rust_target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.rust_target }}

      - name: Rename binary for upload
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.rust_target }}/release/termfix" "dist/${{ matrix.artifact_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  release:
    name: Publish Release Assets
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Cargo.toml version
        id: version
        shell: bash
        run: |
          version="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "(.*)"/\1/')"
          if [[ -z "$version" ]]; then
            echo "Failed to read version from Cargo.toml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifact directories
        shell: bash
        run: |
          mkdir -p release-assets
          find dist -maxdepth 2 -type f -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: Automated build from main branch for version `${{ steps.version.outputs.version }}`.
          files: release-assets/*
